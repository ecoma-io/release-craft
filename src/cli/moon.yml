# The cli project — Phase 12's CLI surface, declared as its own Moon project
# so the boundary between the cli and every other src/ layer is executable
# (module-boundaries.config.mjs judges the `type-cli` tag).
#
# The CLI composes the execution kernel, the planner's door, the domain
# kernel, and the git adapter's barrel — but never the app layer and never
# the package front door (the #155 defect this decomposition prevents).
# The app barrel is reached only through the execution and planner barrels,
# not through `@ecoma-io/release-craft` (which re-exports app).
#
# Task roster:
#   - no `build` task: emitted as part of release-craft:build
#   - `arch` runs once per workspace (release-craft:arch)
id: cli
language: typescript
# The CLI composes the execution kernel, the planner barrel, the domain
# kernel and the git adapter's barrel — never the app layer, never the
# package front door. The edges archkeep judges against `type-cli → …`
# (deliberately NOT type-app, NOT type-package — the #155 defect this row
# makes impossible), and the edges Moon needs for the `project://` inputs
# below.
dependsOn:
  - core-domain
  - planner
  - execution
  - adapters-git
fileGroups:
  sources:
    - "**/*"
tags:
  - type-cli
tasks:
  lint:
    command: eslint . --max-warnings 0
    inputs:
      - "**/*"
      - "/eslint.config.mjs"
      - "/tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
  typecheck:
    command: tsc -p tsconfig.json
    inputs:
      - "**/*"
      - "project://core-domain?group=sources"
      - "project://planner?group=sources"
      - "project://execution?group=sources"
      - "project://adapters-git?group=sources"
      - "/tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
