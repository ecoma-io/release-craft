name: Triage

# The action-agents dogfood run (#101): this repository's issues and pull
# requests are classified by the released sibling action. This is phase 1 of
# the enrollment kit's ladder — dry-run with no sheet — so nothing is
# written: every classification lands in the run record the upload step
# publishes as the `triage-run-record` artifact. `dry-run` is set explicitly
# rather than left to the default so the flip to live is a visible one-line
# diff, and it flips only after the kit's first-run checklist passes at this
# posture.
#
# The action ref is pinned to the commit the `v0.12.1` tag points at, with
# the version kept as the trailing comment — the tag ref itself would fail
# `check:workflows`, which requires a full 40-character commit SHA on every
# `uses:`. Same released bytes, immovable.
#
# `pull-requests: write` is load-bearing even though triage only writes
# labels: GitHub's token refuses the issues-API label write on a pull request
# number without it. There is no checkout step — triage reads everything
# through the API, never the working tree. The record directory is hidden by
# design and upload-artifact prunes hidden files by default, so
# `include-hidden-files` is what keeps the upload from matching zero files
# while reporting success, and `if-no-files-found: warn` keeps a declared
# write that lands nowhere loud instead of green over nothing.

on:
  issues:
    types: [opened, edited, reopened, labeled]
  pull_request:
    types: [opened, edited, synchronize, ready_for_review, reopened, labeled]

permissions: read-all

concurrency:
  group: triage-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: ecoma-io/action-agents/triage@2f0e18a8e1ea5bdfa8fc690057ca1bbdfaa4f3a4 # v0.12.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          api-url: ${{ secrets.ECOMA_LLM_BASE_URL }}
          api-key: ${{ secrets.ECOMA_LLM_API_KEY }}
          model: triage
          dry-run: "false"

      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: triage-run-record
          path: .triage-record/triage-record-*.json
          include-hidden-files: true
          if-no-files-found: warn
