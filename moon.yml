# The release-craft project — the workspace root. Tasks are declared here
# explicitly rather than inherited: with one package there is no inheritance to
# amortise, and explicit tasks keep the inputs honest (declaring `inputs:`
# REPLACES Moon's defaults, so each target names exactly what can move its
# verdict).
#
# Every task is deterministic and cache-safe except `format`, which writes —
# it alone disables caching, because a cached side effect is a lie.
id: release-craft
language: typescript
# The package consumes the kernel (src/index.ts re-exports
# @ecoma-io/release-craft/domain), so the graph must say so: `moon ci --base`
# affected detection walks exactly these edges. Measured without it, a
# kernel-only change resolved to ZERO targets for release-craft:test and
# release-craft:arch in CI — the gates that judge the kernel would silently
# not run. The declared edge is also the architectural truth: the kernel
# declares no dependency back.
deps:
  - core-domain
tags:
  # Moon tags cannot contain colons, so the boundary vocabulary's `type:` is
  # spelled `type-`. module-boundaries.config.mjs judges this tag.
  - type-package

tasks:
  format:
    command: prettier --write .
    options:
      # Writes to the working tree — a side effect. Moon must re-run it every
      # time; caching a formatter is how a stale tree gets called formatted.
      cache: false

  format-check:
    # The command checks the whole working tree, so the inputs must span every
    # project — bare globs are filtered to the owning project, and `scripts/`
    # belongs to gate-scripts (see the arch task below for how that was found).
    command: prettier --check .
    inputs:
      - "**/*"
      - "~gate-scripts:sources"
      - "~core-domain:sources"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/.prettierrc"
      - "/.prettierignore"

  lint:
    command: eslint . --max-warnings 0
    inputs:
      - "src/**/*"
      - "test/**/*"
      - "~gate-scripts:sources"
      - "~core-domain:sources"
      - "vitest.config.ts"
      - "/eslint.config.mjs"
      - "/tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"

  typecheck:
    command: tsc --noEmit
    inputs:
      - "src/**/*"
      - "test/**/*"
      - "~core-domain:sources"
      - "vitest.config.ts"
      - "/tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"

  test:
    command: vitest run --coverage
    inputs:
      - "src/**/*"
      - "test/**/*"
      - "~core-domain:sources"
      - "/vitest.config.ts"
      - "/tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
    outputs:
      - "coverage/**"

  build:
    command: tsc -p tsconfig.build.json
    inputs:
      - "src/**/*"
      - "~core-domain:sources"
      - "/tsconfig.build.json"
      - "/tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
    outputs:
      - "dist/**"

  arch:
    # archkeep reads this workspace's project graph through its Moon provider
    # and judges it against module-boundaries.config.mjs. A root archkeep.json
    # must NOT exist — archkeep refuses a root holding both `.moon/` and
    # `archkeep.json` (see docs/bootstrap/ecosystem-analysis.md).
    #
    # Its inputs span every project's sources: bare globs are filtered to the
    # owning project, so `scripts/**/*` here reaches nothing (that directory
    # belongs to gate-scripts). Cross-project files are named with the
    # `~project:fileGroup` form — measured with a verified `git diff` in the
    # loop, the plain-glob form `~project/**/*` matched nothing and a change
    # under scripts/ or core/domain/ left this verdict cached; the group form
    # is what actually invalidates. A boundary change inside core/domain/ must
    # re-run this verdict, or the cache would outlive the boundary it judged.
    command: archkeep check
    inputs:
      - "src/**/*"
      - "~gate-scripts:sources"
      - "~core-domain:sources"
      - "/module-boundaries.config.mjs"
      - "/.moon/workspace.yml"
      - "/moon.yml"
      - "/scripts/moon.yml"
      - "/core/domain/moon.yml"
      - "/tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
