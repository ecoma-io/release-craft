# The release-craft project — the workspace root. Tasks are declared here
# explicitly rather than inherited: with one package there is no inheritance to
# amortise, and explicit tasks keep the inputs honest (declaring `inputs:`
# REPLACES Moon's defaults, so each target names exactly what can move its
# verdict).
#
# Every task is deterministic and cache-safe except the workspace-wide ones
# (`format`, `format-check`, `arch`) and the root `lint` — see each task for
# why its caching is disabled.
id: release-craft
language: typescript
# The package consumes the kernel and every layer project (src/index.ts
# re-exports @ecoma-io/release-craft/domain plus planner, execution and
# app), so the graph must say so: `moon ci --base` affected detection walks
# exactly these edges. Measured without them, a kernel-only change resolved
# to ZERO targets for release-craft:test and release-craft:arch in CI — the
# gates that judge the kernel would silently not run.
#
# Every edge exists and points the architecture's way: the package consumes
# the layers, never the reverse, and never the gates. Measured, archkeep
# judges declared edges too — a bookkeeping dependsOn to gate-scripts failed
# `pnpm arch` outright ("a dependsOn edge crosses a boundary depConstraints
# forbids"), which is the law working as designed, and Moon refuses
# `project://<id>` inputs without that edge. So the workspace-wide tasks
# cannot name the gate scripts as hashed inputs at all; they opt out of
# caching instead of lying about what they read.
dependsOn:
  - core-domain
  - planner
  - execution
  - app
  - cli
  - adapters-git
  - adapters-github
tags:
  # Moon tags cannot contain colons, so the boundary vocabulary's `type:` is
  # spelled `type-`. module-boundaries.config.mjs judges this tag.
  - type-package

tasks:
  format:
    command: prettier --write .
    options:
      # Writes to the working tree — a side effect. Moon must re-run it every
      # time; caching a formatter is how a stale tree gets called formatted.
      cache: false

  format-check:
    # Checks the whole working tree. The honest inputs for "everything" would
    # span every project, and Moon cannot express that here: the
    # `project://project?group=` input form requires a dependsOn edge (which
    # the boundary law forbids between package and gates), and every glob
    # pointing into scripts/ — bare, workspace-root `/scripts/**/*`, or the
    # legacy tilde forms — was measured to hash as nothing. An incomplete
    # input list under a cache is a stale verdict waiting to happen, so this
    # task never caches; it is a ~1s check and it runs every time it is asked.
    command: prettier --check .
    options:
      cache: false

  lint:
    # `eslint .` runs from the workspace root, so it lints scripts/ and
    # core/domain/ too — files that cannot be listed as hashed inputs (same
    # constraint as format-check above). In CI the affected set covers each
    # project through its own lint task (`...:lint` resolves gate-scripts:lint
    # and core-domain:lint), so the coverage survives; here the task simply
    # never serves a verdict from a cache that could not see all of its
    # subject.
    command: eslint . --max-warnings 0
    options:
      cache: false

  typecheck:
    command: tsc --noEmit
    inputs:
      - "src/index.ts"
      - "src/release-pr-driver.ts"
      - "test/**/*"
      - "action/**/*"
      - "project://core-domain?group=sources"
      - "project://planner?group=sources"
      - "project://execution?group=sources"
      - "project://app?group=sources"
      - "project://cli?group=sources"
      - "project://adapters-git?group=sources"
      - "project://adapters-github?group=sources"
      - "vitest.config.ts"
      - "/tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"

  test:
    command: vitest run --coverage
    # The CLI's subprocess suite (test/cli/) executes the built bin —
    # dist/src/cli/index.js — because the process surface, not the module,
    # is the subject (phase 12 contract §6). The Action artifact suite
    # (test/action/) does the same and also drives action/invoke.mjs, the one
    # script the composite's step runs (phase 13 contract §6), and reads the
    # action.yml metadata itself — so both the script and the metadata are
    # hashed inputs. The build task is a dependency, so the suite never
    # executes a stale dist.
    dependsOn:
      - build
    inputs:
      - "src/index.ts"
      - "src/release-pr-driver.ts"
      - "test/**/*"
      - "action/**/*"
      - "/action.yml"
      - "project://core-domain?group=sources"
      - "project://planner?group=sources"
      - "project://execution?group=sources"
      - "project://app?group=sources"
      - "project://cli?group=sources"
      - "project://adapters-git?group=sources"
      - "project://adapters-github?group=sources"
      - "/vitest.config.ts"
      - "/tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
    outputs:
      - "coverage/**"

  build:
    command: tsc -p tsconfig.build.json
    inputs:
      - "src/index.ts"
      - "src/release-pr-driver.ts"
      - "project://core-domain?group=sources"
      - "project://planner?group=sources"
      - "project://execution?group=sources"
      - "project://app?group=sources"
      - "project://cli?group=sources"
      - "project://adapters-git?group=sources"
      - "project://adapters-github?group=sources"
      - "/tsconfig.build.json"
      - "/tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
    outputs:
      - "dist/**"

  arch:
    # archkeep reads this workspace's project graph through its Moon provider
    # and judges it against module-boundaries.config.mjs. A root archkeep.json
    # must NOT exist — archkeep refuses a root holding both `.moon/` and
    # `archkeep.json` (see docs/bootstrap/ecosystem-analysis.md).
    #
    # The verdict's subject is the whole tree, and the same constraint as
    # format-check applies: the gate scripts' files cannot be named as hashed
    # inputs without the forbidden edge. Caching is off, so the verdict is
    # recomputed every run — a boundary change anywhere re-judges, and the
    # cache can never outlive the boundary it judged. Cross-project files the
    # task genuinely reads are still declared where Moon can hash them: the
    # kernel and every layer through their URIs, the config files at the
    # workspace root, and each project's moon.yml (the tag vocabulary the
    # provider reads).
    command: archkeep check
    options:
      cache: false
    inputs:
      - "project://core-domain?group=sources"
      - "project://planner?group=sources"
      - "project://execution?group=sources"
      - "project://app?group=sources"
      - "project://cli?group=sources"
      - "project://adapters-git?group=sources"
      - "project://adapters-github?group=sources"
      - "/module-boundaries.config.mjs"
      - "/.moon/workspace.yml"
      - "/moon.yml"
      - "/src/planner/moon.yml"
      - "/src/execution/moon.yml"
      - "/src/app/moon.yml"
      - "/src/cli/moon.yml"
      - "/src/adapters/git/moon.yml"
      - "/src/adapters/github/moon.yml"
      - "/scripts/moon.yml"
      - "/core/domain/moon.yml"
      - "/tsconfig.json"
      - "/package.json"
      - "/pnpm-lock.yaml"
